# /home/sscy/lingbot-map/005SenTrixWhale/monitoring/logrotate.conf
# 用法: sudo logrotate -f /path/to/this/file (或放入/etc/logrotate.d/)
# 日志轮转: 每天, 保留7天, 压缩旧日志

/home/sscy/lingbot-map/005SenTrixWhale/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 sscy sscy
    sharedscripts
    postrotate
        # 通知Bridge重新打开日志文件(如果支持)
        pkill -HUP -f "005SenTrixWhale/bridge" 2>/dev/null || true
    endscript
}

/home/sscy/lingbot-map/005SenTrixWhale/bridge/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 sscy sscy
}

/home/sscy/lingbot-map/005SenTrixWhale/bridge/state/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 sscy sscy
}
